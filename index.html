<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SalahKit – Free Offline Islamic Tools</title>
    <meta
      name="description"
      content="Free, offline-first Islamic tools: prayer times, Qibla, Hijri calendar, Quran, dhikr counter and Zakat calculator. No ads, no sign-up, no tracking — a privacy-first alternative to Muslim Pro."
    />
    <meta name="theme-color" content="#0f766e" />
    <meta
      name="keywords"
      content="free prayer times no ads, Muslim Pro alternative, offline Islamic tools, Hijri converter free, Qibla online, Zakat calculator no sign up, privacy Muslim app, Quran reader offline"
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Amiri Quran: full Quranic-mark coverage for Uthmani text.
         Arabic subset only, display=swap, system fonts remain the UI face. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap"
      rel="stylesheet"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SalahKit" />
    <meta property="og:title" content="SalahKit – Free Offline Islamic Tools" />
    <meta
      property="og:description"
      content="Prayer times, Qibla, Hijri calendar, Quran, dhikr, Zakat, duas and the 99 Names — free, offline, no ads, no sign-up."
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SalahKit – Free Offline Islamic Tools" />
    <meta
      name="twitter:description"
      content="Free, offline-first Islamic toolkit. No ads. No sign-up. No tracking."
    />
    <meta name="twitter:image" content="/og-image.svg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "SalahKit",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Web",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Free, offline-first Islamic tools: prayer times, Qibla, Hijri calendar, Quran, dhikr counter and Zakat calculator. No ads, no sign-up, no tracking."
      }
    </script>

    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
